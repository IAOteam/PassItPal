# GitHub Actions Workflow for deploying the backend to Render

name: Deploy Backend to Render

# This workflow runs on pushes to the 'main' branch
on:
  push:
    branches: [ main ]
    # Only run if there are changes in the 'server/' directory
    paths:
      - 'server/**'
      - 'packages/types/**'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'packages/types/**'
      - '.github/workflows/deploy-backend.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build, Test, and Deploy Backend

    # Define the working directory for all steps in this job
    # defaults:
    #   run:
    #     working-directory: ./

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js in the environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Use the same Node version as your Dockerfile

      # - name: Install and Build Shared Types
      #   run: |
      #     cd ../packages/types
      #     npm install
      #     npm run build
      #   # cd ../../server
      #   # npm install
      
      # - name: Install & Build Backend
      #   run: |
      #     cd ../../server
      #     npm install
      #     npm run build

      - name: Install Dependencies
        run: npm install # Single install at the root

      - name: Build All Workspaces
        run: npm run build --workspaces # Build types and server

      - name: Run Backend Tests
        run: npm test --workspace=server

      #  Run the tests. If this step fails, the workflow stops.
      # - name: Run Tests
      #   run:  npm test

      - name: Trigger Render Deploy Hook
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # This step sends a request to the Render Deploy Hook URL.
        # Render then pulls the latest code from your 'main' branch and redeploys the service.
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
