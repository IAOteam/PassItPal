# GitHub Actions Workflow for deploying the backend to Render

name: Deploy Backend to Render

# This workflow runs on pushes to the 'main' branch
on:
  push:
    branches: [ main ]
    # Only run if there are changes in the 'server/' directory
    paths:
      - 'server/**'
      - 'packages/types/**'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'packages/types/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build, Test, and Deploy Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js in the environment
      - name: Setup pnpm and Node.js
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.5
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile # Install all dependencies for the monorepo

      - name: Build Backend and Types
        run: pnpm turbo run build --filter=server

      - name: Run Backend Tests
        run: pnpm test --filter=server

      - name: Trigger Render Deploy Hook
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # This step sends a request to the Render Deploy Hook URL.
        # Render then pulls the latest code from your 'main' branch and redeploys the service.
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
