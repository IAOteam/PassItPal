# GitHub Actions Workflow for deploying the frontend to Vercel

name: Deploy Frontend to Vercel

# This workflow runs on pushes to the 'main' branch
on:
  push:
    branches: [ main ]
    # Only run if there are changes in the 'frontend/' directory
    paths:
      - 'frontend/**'
      - 'packages/types/**'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'packages/types/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build, Test, and Deploy Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm and Node.js
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile # Install all dependencies for the monorepo

      - name: Build Frontend and Types
        run: pnpm turbo run build --filter=frontend

      - name: Run Frontend Tests
        run: pnpm test --filter=frontend

      # This action builds and deploys your app to Vercel.
      # It automatically uses the Vercel CLI to handle everything.
      - name: Deploy to Vercel
        # This will now ONLY deploy to production when you merge to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: amondnet/vercel-action@v20
        with:
          # The Vercel access token we stored in GitHub secrets
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          # The Org ID and Project ID to link to the correct Vercel project
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          # Specifies the directory of our frontend code
          working-directory: ./frontend
