# GitHub Actions Workflow for deploying the frontend to Vercel

name: Deploy Frontend to Vercel

# This workflow runs on pushes to the 'main' branch
on:
  push:
    branches: [ main ]
    # Only run if there are changes in the 'frontend/' directory
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build, Test, and Deploy Frontend

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Use the same Node version as your Dockerfile

      - name: Install Dependencies
        run: npm install

      #  Run the tests. If this step fails, the workflow stops.
      - name: Run Tests
        run: npm test

      # This action builds and deploys your app to Vercel.
      # It automatically uses the Vercel CLI to handle everything.
      - name: Deploy to Vercel
      # This will now ONLY deploy to production when you merge to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        uses: amondnet/vercel-action@v20
        with:
          # The Vercel access token we stored in GitHub secrets
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          # The Org ID and Project ID to link to the correct Vercel project
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          # Specifies the directory of our frontend code
          # working-directory: ./frontend

